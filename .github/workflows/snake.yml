name: Snake

on:
  schedule: [{ cron: "37 9 * * *" }] # daily, 06:37 in São Paulo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d90429&color_dots=#ebedf0,#ffccd3,#ff8fa0,#ef233c,#a1001d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ef233c&color_dots=#161b22,#4a0d14,#7a1220,#c4162f,#ef233c

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
