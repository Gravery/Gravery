<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Pixellic architecture: a pixel goes from the browser through a WebSocket hub to an in-memory chunk map, then asynchronously to SQLite">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#71717a"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d90429"/></marker>
</defs>
<rect width="1200" height="500" rx="18" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="1199" height="499" rx="18" fill="none" stroke="#e4e4e7"/>
<text x="36" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#18181b">Pixellic: how one pixel travels</text>
<text x="36" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#71717a">real-time r/place-style canvas · Go · WebSockets · SQLite WAL · private repo, walkthrough on request</text>
<rect x="36" y="170" width="196" height="104" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="1.25"/><text x="134.0" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#18181b">Browser client</text><text x="134.0" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#52525b">Canvas 2D engine</text><text x="134.0" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#52525b">viewport culling</text><rect x="273" y="170" width="196" height="104" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="1.25"/><text x="371.0" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#18181b">WebSocket hub</text><text x="371.0" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#52525b">Area-of-Interest</text><text x="371.0" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#52525b">deltas to viewers only</text><rect x="510" y="170" width="196" height="104" rx="12" fill="#d9042914" stroke="#d90429" stroke-width="2"/><text x="608.0" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#18181b">Chunk map</text><text x="608.0" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#52525b">64×64 px per chunk</text><text x="608.0" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#52525b">one RWMutex each</text><rect x="747" y="170" width="196" height="104" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="1.25"/><text x="845.0" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#18181b">Write-behind</text><text x="845.0" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#52525b">dirty chunks queued</text><text x="845.0" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#52525b">flushed every 2 s</text><rect x="984" y="170" width="196" height="104" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="1.25"/><text x="1082.0" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#18181b">SQLite</text><text x="1082.0" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#52525b">WAL mode</text><text x="1082.0" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#52525b">batched writes</text><path d="M235 222.0H268" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/><path d="M472 222.0H505" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/><path d="M709 222.0H742" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/><path d="M946 222.0H979" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/><text x="252.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#71717a">place pixel</text><text x="489.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#71717a">validate + apply</text><text x="726.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#71717a">mark dirty</text><text x="963.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#71717a">batch flush</text><path d="M371.0 278V314H134.0V282" fill="none" stroke="#d90429" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="252.5" y="336" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#d90429">broadcast only to intersecting viewports</text><path d="M36 132V122H706V132" fill="none" stroke="#d90429" stroke-width="1.5"/><text x="371.0" y="112" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#d90429" letter-spacing="1">HOT PATH · IN MEMORY</text><path d="M747 132V122H1180V132" fill="none" stroke="#71717a" stroke-width="1.5"/><text x="963.5" y="112" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#71717a" letter-spacing="1">ASYNC · OFF THE HOT PATH</text><rect x="30.0" y="364" width="270" height="100" rx="12" fill="#fafafa" stroke="#e4e4e7"/><text x="52.0" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#d90429">64×64</text><text x="52.0" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#52525b">pixels per lock, no global mutex</text><rect x="320.0" y="364" width="270" height="100" rx="12" fill="#fafafa" stroke="#e4e4e7"/><text x="342.0" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#d90429">2 s</text><text x="342.0" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#52525b">write-behind flush interval</text><rect x="610.0" y="364" width="270" height="100" rx="12" fill="#fafafa" stroke="#e4e4e7"/><text x="632.0" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#d90429">−95%</text><text x="632.0" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#52525b">payload via AoI filtering</text><rect x="900.0" y="364" width="270" height="100" rx="12" fill="#fafafa" stroke="#e4e4e7"/><text x="922.0" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#d90429">0</text><text x="922.0" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#52525b">disk writes on the hot path</text>
</svg>