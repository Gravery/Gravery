<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="PixelPlace architecture: a pixel goes from the browser through a WebSocket hub to an in-memory chunk map, then asynchronously to SQLite">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#71717a"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef233c"/></marker>
</defs>
<rect width="1200" height="500" rx="18" fill="#0d0a0b"/>
<rect x="0.5" y="0.5" width="1199" height="499" rx="18" fill="none" stroke="#2a2122"/>
<text x="36" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#f4f4f5">PixelPlace: how one pixel travels</text>
<text x="36" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#71717a">real-time r/place-style canvas · Go · WebSockets · SQLite WAL · private repo, walkthrough on request</text>
<rect x="36" y="170" width="196" height="104" rx="12" fill="#161112" stroke="#2a2122" stroke-width="1.25"/><text x="134.0" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">Browser client</text><text x="134.0" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a1a1aa">Canvas 2D engine</text><text x="134.0" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a1a1aa">viewport culling</text><rect x="273" y="170" width="196" height="104" rx="12" fill="#161112" stroke="#2a2122" stroke-width="1.25"/><text x="371.0" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">WebSocket hub</text><text x="371.0" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a1a1aa">Area-of-Interest</text><text x="371.0" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a1a1aa">deltas to viewers only</text><rect x="510" y="170" width="196" height="104" rx="12" fill="#ef233c22" stroke="#ef233c" stroke-width="2"/><text x="608.0" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">Chunk map</text><text x="608.0" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a1a1aa">64×64 px per chunk</text><text x="608.0" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a1a1aa">one RWMutex each</text><rect x="747" y="170" width="196" height="104" rx="12" fill="#161112" stroke="#2a2122" stroke-width="1.25"/><text x="845.0" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">Write-behind</text><text x="845.0" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a1a1aa">dirty chunks queued</text><text x="845.0" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a1a1aa">flushed every 2 s</text><rect x="984" y="170" width="196" height="104" rx="12" fill="#161112" stroke="#2a2122" stroke-width="1.25"/><text x="1082.0" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f4f5">SQLite</text><text x="1082.0" y="234" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a1a1aa">WAL mode</text><text x="1082.0" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#a1a1aa">batched writes</text><path d="M235 222.0H268" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/><path d="M472 222.0H505" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/><path d="M709 222.0H742" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/><path d="M946 222.0H979" stroke="#71717a" stroke-width="1.5" marker-end="url(#a)"/><text x="252.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#71717a">place pixel</text><text x="489.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#71717a">validate + apply</text><text x="726.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#71717a">mark dirty</text><text x="963.5" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#71717a">batch flush</text><path d="M371.0 278V314H134.0V282" fill="none" stroke="#ef233c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="252.5" y="336" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#ef233c">broadcast only to intersecting viewports</text><path d="M36 132V122H706V132" fill="none" stroke="#ef233c" stroke-width="1.5"/><text x="371.0" y="112" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#ef233c" letter-spacing="1">HOT PATH · IN MEMORY</text><path d="M747 132V122H1180V132" fill="none" stroke="#71717a" stroke-width="1.5"/><text x="963.5" y="112" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="600" fill="#71717a" letter-spacing="1">ASYNC · OFF THE HOT PATH</text><rect x="30.0" y="364" width="270" height="100" rx="12" fill="#161112" stroke="#2a2122"/><text x="52.0" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#ef233c">64×64</text><text x="52.0" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#a1a1aa">pixels per lock, no global mutex</text><rect x="320.0" y="364" width="270" height="100" rx="12" fill="#161112" stroke="#2a2122"/><text x="342.0" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#ef233c">2 s</text><text x="342.0" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#a1a1aa">write-behind flush interval</text><rect x="610.0" y="364" width="270" height="100" rx="12" fill="#161112" stroke="#2a2122"/><text x="632.0" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#ef233c">−95%</text><text x="632.0" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#a1a1aa">payload via AoI filtering</text><rect x="900.0" y="364" width="270" height="100" rx="12" fill="#161112" stroke="#2a2122"/><text x="922.0" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#ef233c">0</text><text x="922.0" y="444" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#a1a1aa">disk writes on the hot path</text>
</svg>